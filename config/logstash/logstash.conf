# Logstash 配置文件
input {
  # 接收微服务日志（通过 TCP）
  tcp {
    port => 5000
    codec => json_lines
  }
  
  # 接收微服务日志（通过 UDP）
  udp {
    port => 5000
    codec => json_lines
  }
}

filter {
  # 解析 Spring Boot 日志
  if [logger_name] {
    mutate {
      add_field => { "application" => "%{[spring.application.name]}" }
    }
  }
  
  # 解析时间戳
  date {
    match => [ "timestamp", "ISO8601", "yyyy-MM-dd HH:mm:ss.SSS" ]
    target => "@timestamp"
  }
  
  # 解析追踪信息
  if [traceId] {
    mutate {
      add_field => { "trace_id" => "%{traceId}" }
      add_field => { "span_id" => "%{spanId}" }
    }
  }
}

output {
  # 输出到 Elasticsearch
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "quiz-logs-%{+YYYY.MM.dd}"
  }
  
  # 调试输出（可选）
  # stdout { codec => rubydebug }
}
